<!-- Header Component -->
<header class="bg-white p-6 rounded-lg shadow mb-6 border border-gray-200">
    <h1 class="text-center text-3xl font-bold text-gray-800 mb-6">
        <i class="fas fa-clipboard-list mr-2 text-blue-600"></i>
        To Do List
    </h1>
    <div class="space-y-3 max-w-xl mx-auto">
        <input [(ngModel)]="title" type="text" placeholder="Task title" maxlength="100"
            class="w-full p-3 border border-gray-300 rounded focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-colors">
        <input [(ngModel)]="description" type="text" placeholder="Description" maxlength="300"
            class="w-full p-3 border border-gray-300 rounded focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-colors">
        <button (click)="addTask()"
            class="w-full p-3 bg-blue-600 text-white font-semibold rounded hover:bg-blue-700 transition-colors">
            <i class="fas fa-plus mr-2"></i>
            Add Task
        </button>
    </div>
</header>
