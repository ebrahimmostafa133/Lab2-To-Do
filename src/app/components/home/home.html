<!-- Main Section -->
<section class="bg-gray-100 min-h-screen py-8">
    <div class="container mx-auto px-4">
        <app-to-do-header (addTaskEvent)="addTask($event)"></app-to-do-header>
        <app-to-do-body [tasks]="tasks" (deleteEvent)="deleteTask($event)"
            (toggleEvent)="toggleTask($event)"></app-to-do-body>
    </div>
</section>
